# Marketplace demo stack for the VPS.
#
# Nothing here publishes a port to the internet. Postgres and Redis bind to
# 127.0.0.1 only (handy for psql over SSH), and the API answers on 127.0.0.1
# so nginx is the single front door.
#
# Las rutas al repo del backend llegan por variables, porque este archivo vive
# en su propio repositorio y no sabe dónde clonaron el otro. Las pone server.sh.
#
#   BACK_CONTEXT=/ruta/marketplace-back DEPLOY_DIR=/ruta/marketplace-deploy #     docker compose --env-file $BACK_CONTEXT/.env -f docker-compose.prod.yml up -d

name: citas-demo

services:
  postgres:
    image: postgres:17-alpine
    container_name: citas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    ports:
      - '127.0.0.1:5450:5432'
    volumes:
      # Sin init.sql: aquí el esquema lo manda Drizzle, no un volcado.
      - citas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-citas}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ${BACK_CONTEXT:?falta BACK_CONTEXT}
      dockerfile: ${DEPLOY_DIR:?falta DEPLOY_DIR}/Dockerfile.api
    image: citas-api:latest
    container_name: citas_api
    restart: unless-stopped
    env_file:
      - ${BACK_CONTEXT:?falta BACK_CONTEXT}/api.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-citas}
    ports:
      - '127.0.0.1:5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  citas_pgdata:
