# Demostración del marketplace: SPA estática, API y WebSocket bajo el mismo
# origen. Al ser mismo origen, el frontend no necesita CORS; el que sí lo
# necesita es el portafolio, que llama a api.veloce-ts.com desde otro dominio.

upstream citas_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name citas.alfredomejia.com.mx;

    root /var/www/citas;
    index index.html;

    access_log /var/log/nginx/citas.access.log;
    error_log  /var/log/nginx/citas.error.log;

    # Esta es la línea que permite que el portafolio lo meta en un iframe.
    # X-Frame-Options no sirve aquí: su allow-from está muerto en los
    # navegadores modernos, y poner DENY mataría el playground.
    add_header Content-Security-Policy "frame-ancestors https://alfredomejia.com.mx https://www.alfredomejia.com.mx" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Un adjunto clínico son 5 MiB como máximo y el sobre del multipart suma
    # encima. Por debajo de esto nginx corta la subida con un 413 que la
    # aplicación nunca ve.
    client_max_body_size 6m;

    # La consola del portafolio arranca por aquí; sin esta regla caería en la
    # SPA y devolvería HTML donde se espera JSON.
    location /health {
        proxy_pass http://citas_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/ {
        proxy_pass http://citas_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }


    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # nginx no hereda los add_header del servidor en un location que
        # tiene los suyos, asi que hay que repetirlos aqui o la pagina sale
        # sin ninguna cabecera de seguridad. Los assets si las traen, lo que
        # hace el fallo dificil de ver.
        add_header Content-Security-Policy "frame-ancestors https://alfredomejia.com.mx https://www.alfredomejia.com.mx" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # Sin $uri/ a proposito. El frontend trae public/demo/ con las
        # ilustraciones, asi que /var/www/citas/demo/ existe como
        # carpeta y choca con la ruta /demo de la aplicacion: nginx intentaria
        # listar el directorio y responde 403. Los archivos sueltos de esa
        # carpeta se siguen sirviendo porque $uri los encuentra.
        try_files $uri /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
