# Demostración del chat: SPA estática y API bajo el mismo origen, de modo que
# el frontend no necesita CORS. El que sí lo necesita es el portafolio, que
# llama desde otro dominio.

upstream aichat_api {
    server 127.0.0.1:3107;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.alfredomejia.com.mx;

    root /var/www/aichat;
    index index.html;

    access_log /var/log/nginx/aichat.access.log;
    error_log  /var/log/nginx/aichat.error.log;

    # Permite que el portafolio lo meta en un iframe. X-Frame-Options no sirve
    # aquí: su allow-from está muerto en los navegadores modernos, y poner DENY
    # mataría el playground.
    add_header Content-Security-Policy "frame-ancestors https://alfredomejia.com.mx https://www.alfredomejia.com.mx" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 2m;

    # La consola del portafolio arranca por aquí; sin esta regla caería en la
    # SPA y devolvería HTML donde se espera JSON.
    location /health {
        proxy_pass http://aichat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/ {
        proxy_pass http://aichat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Lo que hace falta para que el streaming se vea.
        #
        # Con el búfer puesto, nginx junta la respuesta y la suelta completa:
        # el chat deja de llegar token a token y aparece de golpe, que es
        # exactamente lo que este proyecto existe para no hacer.
        proxy_buffering off;
        proxy_cache off;
        # Se lo dice también a cualquier proxy que haya más adelante.
        add_header X-Accel-Buffering "no" always;
        # Una respuesta larga puede tardar más que el minuto por omisión, y
        # cortarla a medias se vería como un fallo del modelo.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # nginx no hereda los add_header del servidor en un location que tiene
        # los suyos, así que hay que repetirlos o la página sale sin ninguna
        # cabecera de seguridad. Los assets sí las traen, lo que hace el fallo
        # difícil de ver.
        add_header Content-Security-Policy "frame-ancestors https://alfredomejia.com.mx https://www.alfredomejia.com.mx" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
