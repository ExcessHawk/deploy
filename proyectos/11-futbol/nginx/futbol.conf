# Fútbol Analytics: todo es la aplicación de Streamlit, no hay nada estático
# que servir aparte.
#
# Dos cosas lo separan de los demás sitios de este servidor:
#
#   1. Streamlit habla por WebSocket. Toda la interacción —cambiar de liga,
#      abrir un partido, subir un boleto— viaja por /_stcore/stream. Sin las
#      cabeceras de Upgrade, la página carga y después se queda congelada con
#      "Please wait..." para siempre, que es el fallo más confuso posible
#      porque el HTML sí llegó.
#
#   2. No se deja meter en un iframe. El portafolio enlaza a este sitio en
#      lugar de incrustarlo, así que frame-ancestors puede ser 'none'.

upstream futbol_app {
    server 127.0.0.1:3108;
    keepalive 16;
}

# El valor que toma Connection depende de si el cliente pidió Upgrade. Con un
# "Connection: upgrade" fijo, las peticiones normales se rompen.
map $http_upgrade $futbol_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name futbol.alfredomejia.com.mx;

    access_log /var/log/nginx/futbol.access.log;
    error_log  /var/log/nginx/futbol.error.log;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El analizador de boletos recibe capturas de pantalla, y pueden ser
    # varias en el mismo envío. Por debajo de esto nginx corta la subida con un
    # 413 que la aplicación nunca ve.
    client_max_body_size 25m;

    location /_stcore/stream {
        proxy_pass http://futbol_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $futbol_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El socket se queda callado mientras nadie toca la página. Con el
        # minuto por omisión, nginx lo cierra y la aplicación se reconecta sin
        # parar; esto lo deja vivo una hora.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /_stcore/health {
        proxy_pass http://futbol_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://futbol_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $futbol_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un backtest o una página con muchos partidos tarda más que el minuto
        # por omisión la primera vez, antes de que la caché de Streamlit se
        # llene.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
